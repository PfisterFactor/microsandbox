name: Fedora RPM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBKRUNFW_VERSION: "5.2.1"
  LIBKRUNFW_ABI: "5"
  FEDORA_IMAGE: "fedora:41"

permissions:
  contents: write
  pages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build msb + libkrunfw + RPM, per arch.
  # ---------------------------------------------------------------------------
  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            agentd_target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            agentd_target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      - name: Cache libkrunfw build
        id: cache-libkrunfw
        uses: actions/cache@v4
        with:
          path: vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          key: libkrunfw-${{ matrix.arch }}-${{ hashFiles('vendor/libkrunfw/**') }}

      - name: Build libkrunfw
        if: steps.cache-libkrunfw.outputs.cache-hit != 'true'
        run: |
          cd vendor/libkrunfw
          make -j$(nproc)

      - name: Build agentd (musl guest binary)
        run: |
          rustup target add ${{ matrix.agentd_target }}
          cargo build --release --manifest-path crates/agentd/Cargo.toml --target ${{ matrix.agentd_target }}
          mkdir -p build
          cp crates/agentd/target/${{ matrix.agentd_target }}/release/agentd build/agentd

      - name: Build msb
        run: |
          cargo build --release --no-default-features --features net -p microsandbox-cli
          strip target/release/msb

      - name: Stage sources for RPM
        run: |
          mkdir -p packaging/rpm/sources
          cp target/release/msb                                              packaging/rpm/sources/msb
          cp vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}      packaging/rpm/sources/libkrunfw.so.5.2.1
          cp LICENSE                                                         packaging/rpm/sources/LICENSE
          ls -lh packaging/rpm/sources/

      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          BUILDNUM=$(date -u +%s)
          SHORTSHA=${GITHUB_SHA::7}
          echo "version=${VERSION}"  >> "${GITHUB_OUTPUT}"
          echo "buildnum=${BUILDNUM}" >> "${GITHUB_OUTPUT}"
          echo "shortsha=${SHORTSHA}" >> "${GITHUB_OUTPUT}"
          echo "Building ${VERSION}-0.${BUILDNUM}.git${SHORTSHA}"

      - name: Build RPM in Fedora container
        run: |
          docker run --rm \
            -v "${PWD}:/work" -w /work \
            -e RPM_VERSION="${{ steps.meta.outputs.version }}" \
            -e RPM_BUILDNUM="${{ steps.meta.outputs.buildnum }}" \
            -e RPM_SHORTSHA="${{ steps.meta.outputs.shortsha }}" \
            -e GH_OWNER="${{ github.repository_owner }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "${FEDORA_IMAGE}" \
            bash packaging/rpm/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: packaging/rpm/out/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Upsert a rolling "main-latest" GitHub Release with both RPMs attached.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish rolling Release
    needs: build-rpm
    runs-on: ubuntu-latest
    concurrency:
      group: fedora-rpm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms
          pattern: rpm-*
          merge-multiple: true

      - name: List RPMs
        run: ls -lh rpms/

      - name: Upsert main-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Rolling build from \`main\` @ \`${GITHUB_SHA::7}\` — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          if gh release view main-latest >/dev/null 2>&1; then
            gh release edit main-latest --prerelease --title "Rolling main build" --notes "${NOTES}"
          else
            gh release create main-latest --prerelease --title "Rolling main build" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi
          gh release upload main-latest rpms/*.rpm --clobber

  # ---------------------------------------------------------------------------
  # Push a dnf repository tree (createrepo_c --update) to gh-pages branch.
  # GitHub Pages must be configured to serve from gh-pages / root.
  # ---------------------------------------------------------------------------
  publish-pages:
    name: Publish dnf repo to gh-pages
    needs: build-rpm
    runs-on: ubuntu-latest
    concurrency:
      group: fedora-rpm-pages
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages (or init if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null \
          || {
            echo "gh-pages branch missing — initialising a fresh one"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            cd site
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "init gh-pages"
          }

      - name: Checkout source for templates
        uses: actions/checkout@v4
        with:
          path: src

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: new-rpms
          pattern: rpm-*

      - name: Stage RPMs into site tree
        run: |
          set -euo pipefail
          mkdir -p site/fedora/x86_64 site/fedora/aarch64
          if ls new-rpms/rpm-x86_64/*.rpm >/dev/null 2>&1; then
            cp -v new-rpms/rpm-x86_64/*.rpm site/fedora/x86_64/
          fi
          if ls new-rpms/rpm-aarch64/*.rpm >/dev/null 2>&1; then
            cp -v new-rpms/rpm-aarch64/*.rpm site/fedora/aarch64/
          fi
          touch site/.nojekyll

      - name: Generate repo metadata with createrepo_c
        run: |
          docker run --rm -v "${PWD}/site:/s" -w /s "${FEDORA_IMAGE}" bash -c '
            set -euo pipefail
            dnf install -y --setopt=install_weak_deps=False createrepo_c >/dev/null
            for arch in x86_64 aarch64; do
              if [ -d "/s/fedora/${arch}" ]; then
                if [ -d "/s/fedora/${arch}/repodata" ]; then
                  createrepo_c --update "/s/fedora/${arch}"
                else
                  createrepo_c "/s/fedora/${arch}"
                fi
              fi
            done
          '
          sudo chown -R "$(id -u):$(id -g)" site

      - name: Render .repo and index.html
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BASE_URL="https://${OWNER}.github.io/${REPO_NAME}"
          BUILD_TS="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
          sed -e "s|{{BASE_URL}}|${BASE_URL}|g" \
              -e "s|{{OWNER}}|${GITHUB_REPOSITORY_OWNER}|g" \
              src/packaging/rpm/microsandbox.repo.template > site/microsandbox.repo
          sed -e "s|{{BASE_URL}}|${BASE_URL}|g" \
              -e "s|{{OWNER}}|${GITHUB_REPOSITORY_OWNER}|g" \
              -e "s|{{BUILD_TIMESTAMP}}|${BUILD_TS}|g" \
              src/packaging/rpm/index.html.template > site/index.html
          echo "--- microsandbox.repo ---"
          cat site/microsandbox.repo

      - name: Commit and push gh-pages
        run: |
          set -euo pipefail
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "publish rpm repo @ ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
